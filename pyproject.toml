[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aurix-agent"
version = "0.85.0"
description = "A local-first AI engineering agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "python-dotenv>=1.0,<2"]

[project.optional-dependencies]
dev = ["pytest>=9.0.3,<10", "pytest-cov>=5,<7", "ruff>=0.5,<1"]
neon = ["psycopg[binary,pool]>=3.2,<4"]
documents = ["pypdf>=5,<7"]

[project.scripts]
aurix = "aurix.cli:main"

[tool.setuptools.packages.find]
include = ["aurix*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
