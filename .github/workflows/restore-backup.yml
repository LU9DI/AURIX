name: Restore repository from complete backup

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract archived project files
        shell: bash
        run: |
          set -euo pipefail
          archive="AURIX-complete-backup-v0.85.0-2026-10-09.zip"
          test -s "$archive"
          mkdir -p /tmp/aurix-restore
          python - <<'PY'
          import zipfile
          from pathlib import Path, PurePosixPath
          archive = Path("AURIX-complete-backup-v0.85.0-2026-10-09.zip")
          dest = Path("/tmp/aurix-restore").resolve()
          with zipfile.ZipFile(archive) as z:
              for item in z.infolist():
                  name = PurePosixPath(item.filename)
                  if name.is_absolute() or ".." in name.parts:
                      raise SystemExit(f"Unsafe archive path: {item.filename}")
                  target = (dest / str(name)).resolve()
                  if dest not in target.parents and target != dest:
                      raise SystemExit(f"Unsafe archive path: {item.filename}")
                  if item.is_dir():
                      target.mkdir(parents=True, exist_ok=True)
                  else:
                      target.parent.mkdir(parents=True, exist_ok=True)
                      with z.open(item) as src, target.open("wb") as out:
                          out.write(src.read())
          print(f"Extracted {len(zipfile.ZipFile(archive).infolist())} archive entries")
          PY
          # Restore the archive's complete directory structure into the repository.
          cp -a /tmp/aurix-restore/. .
          # Keep the uploaded backup itself as an immutable recovery artifact.
          git add -A
          if git diff --cached --quiet; then
            echo "No extracted changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Restore project files from complete backup v0.85.0"
          git push
