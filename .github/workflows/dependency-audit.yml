name: Python dependency audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "37 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-dependency-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Install package and audit tool
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" pip-audit
      - name: Audit resolved Python dependencies
        run: pip-audit
