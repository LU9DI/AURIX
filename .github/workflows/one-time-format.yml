name: One-time repository formatting

on:
  push:
    branches: [fix/audit-gaps-repository-hardening]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/audit-gaps-repository-hardening
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Apply deterministic Ruff fixes and formatting
        run: |
          ruff check --fix . || true
          ruff format .
      - name: Commit formatting changes
        run: |
          if git diff --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "style: normalize Ruff formatting across repository"
          git push origin fix/audit-gaps-repository-hardening
